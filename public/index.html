<!DOCTYPE html>
<html>
<head>

    <script async
        src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7800098599547950"
        crossorigin="anonymous">
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TradeContentAI</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #0a0a0a;
            color: white;
            padding: 20px;
            max-width: 800px;
            margin: auto;
        }

        input,
        textarea,
        button {
            width: 100%;
            padding: 15px;
            margin: 8px 0;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            box-sizing: border-box;
        }

        input,
        textarea {
            background: #1a1a1a;
            color: white;
            border: 1px solid #333;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            background: #00ff88;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }

        button.secondary {
            background: #333;
            color: white;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .hidden {
            display: none;
        }

        .box {
            background: #111;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
        }

        #output {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 8px;
            white-space: pre-wrap;
            line-height: 1.6;
            min-height: 50px;
            margin-top: 15px;
        }

        .error {
            color: #ff6b6b;
        }

        .success {
            color: white;
        }

        .account-bar {
            background: #151515;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .account-bar button {
            width: auto;
            padding: 8px 14px;
            margin: 0;
        }

        .tabs {
            display: flex;
            gap: 8px;
        }

        .tabs button {
            width: 50%;
        }

        .small {
            color: #aaa;
            font-size: 14px;
        }

        #remaining {
            color: #00ff88;
            font-weight: bold;
        }

        .limit-box {
            background: #151515;
            border: 1px solid #333;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
        }

    </style>

</head>

<body>

<h1>🔥 TradeContentAI</h1>


<!-- ========================================================= -->
<!-- AUTH SCREEN -->
<!-- ========================================================= -->

<div id="authScreen" class="box">

    <div class="tabs">

        <button
            id="loginTab"
            onclick="showLogin()">
            Log In
        </button>

        <button
            id="signupTab"
            class="secondary"
            onclick="showSignup()">
            Create Account
        </button>

    </div>


    <!-- LOGIN -->

    <div id="loginForm">

        <h2>Welcome Back</h2>

        <input
            id="loginEmail"
            type="email"
            placeholder="Email address">

        <input
            id="loginPassword"
            type="password"
            placeholder="Password">

        <button
            id="loginButton"
            onclick="login()">
            Log In
        </button>

    </div>


    <!-- SIGNUP -->

    <div id="signupForm" class="hidden">

        <h2>Create Your Account</h2>

        <input
            id="signupEmail"
            type="email"
            placeholder="Email address">

        <input
            id="signupPassword"
            type="password"
            placeholder="Create password">

        <button
            id="signupButton"
            onclick="signup()">
            Create Account
        </button>

    </div>


    <div id="authMessage"></div>

</div>



<!-- ========================================================= -->
<!-- MAIN APP -->
<!-- ========================================================= -->

<div id="appScreen" class="hidden">

    <div class="account-bar">

        <div>

            👤 <span id="userEmail"></span>

            <div class="small">

                Free generations remaining:

                <span id="remaining">3</span>

            </div>

        </div>


        <button
            class="secondary"
            onclick="logout()">

            Log Out

        </button>

    </div>


    <p>
        What do you want to post about today?
    </p>


    <textarea
        id="topic"
        rows="3"
        placeholder="Example: 5 ways to grow an Instagram page">
    </textarea>


    <button
        id="generateButton"
        onclick="handleGenerateClick()">

        Generate Post

    </button>


    <div
        id="limitBox"
        class="limit-box hidden">

        <strong>Daily limit reached.</strong>

        <div class="small">
            Your free generations have been used for today.
            You can come back tomorrow.
        </div>

    </div>


    <div id="output"></div>

</div>



<script>


// =========================================================
// SUPABASE CONFIG
// =========================================================

const SUPABASE_URL =
    "https://rbccdpbzpkexbjvxoqum.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_xVlsUXU8Wm8ouTf3xeKrzg_X37uHzYo";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


// =========================================================
// SHOW LOGIN
// =========================================================

function showLogin() {

    document
        .getElementById("loginForm")
        .classList.remove("hidden");

    document
        .getElementById("signupForm")
        .classList.add("hidden");

    document
        .getElementById("authMessage")
        .innerText = "";

}


// =========================================================
// SHOW SIGNUP
// =========================================================

function showSignup() {

    document
        .getElementById("signupForm")
        .classList.remove("hidden");

    document
        .getElementById("loginForm")
        .classList.add("hidden");

    document
        .getElementById("authMessage")
        .innerText = "";

}


// =========================================================
// CREATE ACCOUNT
// =========================================================

async function signup() {

    const email =
        document
            .getElementById("signupEmail")
            .value
            .trim();

    const password =
        document
            .getElementById("signupPassword")
            .value;

    const message =
        document.getElementById("authMessage");

    const button =
        document.getElementById("signupButton");


    if (!email || !password) {

        message.className = "error";

        message.innerText =
            "Please enter your email and password.";

        return;

    }


    if (password.length < 6) {

        message.className = "error";

        message.innerText =
            "Password must be at least 6 characters.";

        return;

    }


    button.disabled = true;

    button.innerText =
        "Creating account...";

    message.className = "success";

    message.innerText =
        "Creating your account...";


    try {

        const {
            data,
            error
        } =
            await supabaseClient.auth.signUp({

                email: email,

                password: password

            });


        if (error) {
            throw error;
        }


        if (data.user && !data.session) {

            message.className = "success";

            message.innerText =
                "✅ Account created! Check your email to confirm your account, then log in.";

            return;

        }


        if (data.user) {

            message.className = "success";

            message.innerText =
                "✅ Account created successfully.";

            await showApp(data.user);

        }

    }

    catch (error) {

        console.error(
            "Signup error:",
            error
        );

        message.className = "error";

        message.innerText =
            "Signup failed: " + error.message;

    }

    finally {

        button.disabled = false;

        button.innerText =
            "Create Account";

    }

}


// =========================================================
// LOGIN
// =========================================================

async function login() {

    const email =
        document
            .getElementById("loginEmail")
            .value
            .trim();

    const password =
        document
            .getElementById("loginPassword")
            .value;

    const message =
        document.getElementById("authMessage");

    const button =
        document.getElementById("loginButton");


    if (!email || !password) {

        message.className = "error";

        message.innerText =
            "Please enter your email and password.";

        return;

    }


    button.disabled = true;

    button.innerText =
        "Logging in...";

    message.className = "success";

    message.innerText =
        "Checking your login...";


    try {

        const {
            data,
            error
        } =
            await supabaseClient.auth.signInWithPassword({

                email: email,

                password: password

            });


        if (error) {

            console.error(
                "Supabase login error:",
                error
            );

            throw error;

        }


        if (!data.user) {

            throw new Error(
                "No user account was returned."
            );

        }


        message.className = "success";

        message.innerText =
            "✅ Login successful.";


        await showApp(data.user);

    }

    catch (error) {

        console.error(
            "Login error:",
            error
        );

        message.className = "error";

        message.innerText =
            "Login failed: " + error.message;

    }

    finally {

        button.disabled = false;

        button.innerText =
            "Log In";

    }

}


// =========================================================
// LOGOUT
// =========================================================

async function logout() {

    await supabaseClient.auth.signOut();


    document
        .getElementById("appScreen")
        .classList.add("hidden");


    document
        .getElementById("authScreen")
        .classList.remove("hidden");


    showLogin();

}


// =========================================================
// SHOW APP
// =========================================================

async function showApp(user) {

    if (!user) return;


    document
        .getElementById("authScreen")
        .classList.add("hidden");


    document
        .getElementById("appScreen")
        .classList.remove("hidden");


    document
        .getElementById("userEmail")
        .innerText =
            user.email || "";


    await updateRemaining();

}


// =========================================================
// CHECK CURRENT USER
// =========================================================

async function checkUser() {

    try {

        const {
            data: {
                user
            },
            error
        } =
            await supabaseClient.auth.getUser();


        if (error) {

            console.error(
                "User check error:",
                error
            );

        }


        if (user) {

            await showApp(user);

        }

        else {

            document
                .getElementById("authScreen")
                .classList.remove("hidden");

            document
                .getElementById("appScreen")
                .classList.add("hidden");

        }

    }

    catch (error) {

        console.error(
            "Startup error:",
            error
        );

    }

}


// =========================================================
// UPDATE GENERATION DISPLAY
//
// IMPORTANT:
// The browser no longer directly counts rows from
// generation_requests.
//
// The server/Supabase reserve_generation() system is now
// responsible for deciding whether a generation is allowed.
// =========================================================

async function updateRemaining() {

    const button =
        document.getElementById(
            "generateButton"
        );

    const limitBox =
        document.getElementById(
            "limitBox"
        );


    if (button) {

        button.disabled = false;

        button.innerText =
            "Generate Post";

    }


    if (limitBox) {

        limitBox.classList.add(
            "hidden"
        );

    }

}


// =========================================================
// GENERATE BUTTON CLICK
// =========================================================

async function handleGenerateClick() {

    const output =
        document.getElementById(
            "output"
        );

    const button =
        document.getElementById(
            "generateButton"
        );


    const {
        data: {
            user
        }
    } =
        await supabaseClient.auth.getUser();


    if (!user) {

        output.className =
            "error";

        output.innerText =
            "Please log in first.";

        return;

    }


    await generate();

}


// =========================================================
// GENERATE POST
// =========================================================

async function generate() {

    const topic =
        document
            .getElementById("topic")
            .value
            .trim();


    const output =
        document.getElementById(
            "output"
        );


    const button =
        document.getElementById(
            "generateButton"
        );


    const limitBox =
        document.getElementById(
            "limitBox"
        );


    if (!topic) {

        output.className =
            "error";

        output.innerText =
            "Please enter a topic first.";

        return;

    }


    const {
        data: {
            user
        }
    } =
        await supabaseClient.auth.getUser();


    if (!user) {

        output.className =
            "error";

        output.innerText =
            "Please log in first.";

        return;

    }


    output.className =
        "success";

    output.innerText =
        "Generating your post...";


    button.disabled = true;

    button.innerText =
        "Generating...";


    if (limitBox) {

        limitBox.classList.add(
            "hidden"
        );

    }


    try {

        const {
            data: {
                session
            }
        } =
            await supabaseClient.auth.getSession();


        if (!session) {

            throw new Error(
                "Your login session has expired. Please log in again."
            );

        }


        const response =
            await fetch(
                "/generate",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            session.access_token

                    },

                    body: JSON.stringify({

                        topic: topic

                    })

                }
            );


        let data = null;


        try {

            data =
                await response.json();

        }

        catch {

            data = null;

        }


        // =====================================================
        // DAILY LIMIT REACHED
        // =====================================================

        if (
            response.status === 429
        ) {

            output.className =
                "error";

            output.innerText =
                data?.error ||
                "You have reached your daily generation limit.";

            if (limitBox) {

                limitBox.classList.remove(
                    "hidden"
                );

            }

            button.disabled = false;

            button.innerText =
                "Generate Post";

            return;

        }


        // =====================================================
        // OTHER SERVER ERROR
        // =====================================================

        if (!response.ok) {

            throw new Error(
                data?.error ||
                "The server could not generate your post."
            );

        }


        // =====================================================
        // SUCCESS
        // =====================================================

        if (!data?.content) {

            throw new Error(
                "The AI returned no content. Please try again."
            );

        }


        output.className =
            "success";

        output.innerText =
            data.content;


        document
            .getElementById("topic")
            .value = "";


        // -----------------------------------------------------
        // Show the server's authoritative remaining count.
        // -----------------------------------------------------

        if (
            typeof data.remaining !==
            "undefined" &&
            data.remaining !== null
        ) {

            document
                .getElementById(
                    "remaining"
                )
                .innerText =
                    data.remaining;

        }


    }

    catch (error) {

        console.error(
            "Generate error:",
            error
        );

        output.className =
            "error";

        output.innerText =
            "❌ Error: " +
            error.message;

    }

    finally {

        button.disabled = false;

        if (
            button.innerText ===
            "Generating..."
        ) {

            button.innerText =
                "Generate Post";

        }

    }

}


// =========================================================
// START APPLICATION
// =========================================================

checkUser();


</script>

</body>
</html>
