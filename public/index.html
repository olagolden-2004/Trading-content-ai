<!DOCTYPE html>
<html>
<head>
  <title>TradeContentAI</title>
  <style>
    body { font-family: Arial; background: #0a0a0a; color: white; padding: 20px; max-width: 800px; margin: auto; }
    textarea, button { width: 100%; padding: 15px; margin: 10px 0; border-radius: 8px; border: none; font-size: 16px; }
    button { background: #00ff88; color: black; font-weight: bold; cursor: pointer; }
    #output { background: #1a1a1a; padding: 20px; border-radius: 8px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>🔥 TradeContentAI</h1>
  <p>What do you want to post about today?</p>
  <textarea id="topic" rows="3" placeholder="Example: 3 mistakes new traders make on V100"></textarea>
  <button onclick="generate()">Generate 3 Posts</button>
  <div id="output"></div>

  <script>
    async function generate() {
      const topic = document.getElementById('topic').value;
      document.getElementById('output').innerText = 'Generating...';
      const res = await fetch('/generate', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({topic})
      });
      const data = await res.json();
      document.getElementById('output').innerText = data.content;
    }
  </script>
</body>
</html>
