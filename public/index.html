<!DOCTYPE html>
<html>
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7800098599547950"
     crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeContentAI</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0a0a0a;
            color: white;
            padding: 20px;
            max-width: 800px;
            margin: auto;
        }

        input, textarea, button {
            width: 100%;
            padding: 15px;
            margin: 8px 0;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            box-sizing: border-box;
        }

        input, textarea {
            background: #1a1a1a;
            color: white;
            border: 1px solid #333;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            background: #00ff88;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }

        button.secondary {
            background: #333;
            color: white;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .hidden {
            display: none;
        }

        .box {
            background: #111;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
        }

        #output {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 8px;
            white-space: pre-wrap;
            line-height: 1.6;
            min-height: 50px;
            margin-top: 15px;
        }

        .error {
            color: #ff6b6b;
        }

        .success {
            color: white;
        }

        .account-bar {
            background: #151515;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .account-bar button {
            width: auto;
            padding: 8px 14px;
            margin: 0;
        }

        .tabs {
            display: flex;
            gap: 8px;
        }

        .tabs button {
            width: 50%;
        }

        .small {
            color: #aaa;
            font-size: 14px;
        }

        #remaining {
            color: #00ff88;
            font-weight: bold;
        }
    </style>
</head>

<body>

<h1>🔥 TradeContentAI</h1>

<!-- AUTH SCREEN -->
<div id="authScreen" class="box">

    <div class="tabs">
        <button id="loginTab" onclick="showLogin()">Log In</button>
        <button id="signupTab" class="secondary" onclick="showSignup()">Create Account</button>
    </div>

    <div id="loginForm">

        <h2>Welcome Back</h2>

        <input
            id="loginEmail"
            type="email"
            placeholder="Email address"
        >

        <input
            id="loginPassword"
            type="password"
            placeholder="Password"
        >

        <button onclick="login()">Log In</button>

    </div>

    <div id="signupForm" class="hidden">

        <h2>Create Your Account</h2>

        <input
            id="signupEmail"
            type="email"
            placeholder="Email address"
        >

        <input
            id="signupPassword"
            type="password"
            placeholder="Create password"
        >

        <button onclick="signup()">Create Account</button>

    </div>

    <div id="authMessage"></div>

</div>


<!-- MAIN APP -->
<div id="appScreen" class="hidden">

    <div class="account-bar">

        <div>
            👤 <span id="userEmail"></span>

            <div class="small">
                Free generations remaining:
                <span id="remaining">3</span>
            </div>
        </div>

        <button class="secondary" onclick="logout()">
            Log Out
        </button>

    </div>

    <p>What do you want to post about today?</p>

    <textarea
        id="topic"
        rows="3"
        placeholder="Example: 5 ways to grow an Instagram page"
    ></textarea>

    <button id="generateButton" onclick="generate()">
        Generate Post
    </button>

    <div id="output"></div>

</div>


<script>

// ==========================================
// SUPABASE CONFIG
// ==========================================

const SUPABASE_URL =
    "https://rbccdpbzpkexbjvxoqum.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_xVlsUXU8Wm8ouTf3xeKrzg_X37uHzYo";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


// ==========================================
// AUTH SCREEN
// ==========================================

function showLogin() {

    document.getElementById("loginForm")
        .classList.remove("hidden");

    document.getElementById("signupForm")
        .classList.add("hidden");

    document.getElementById("authMessage").innerText = "";
}


function showSignup() {

    document.getElementById("signupForm")
        .classList.remove("hidden");

    document.getElementById("loginForm")
        .classList.add("hidden");

    document.getElementById("authMessage").innerText = "";
}


// ==========================================
// CREATE ACCOUNT
// ==========================================

async function signup() {

    const email =
        document.getElementById("signupEmail").value.trim();

    const password =
        document.getElementById("signupPassword").value;

    const message =
        document.getElementById("authMessage");

    if (!email || !password) {

        message.className = "error";

        message.innerText =
            "Please enter your email and password.";

        return;
    }

    if (password.length < 6) {

        message.className = "error";

        message.innerText =
            "Password must be at least 6 characters.";

        return;
    }

    message.className = "success";

    message.innerText =
        "Creating your account...";

    const { data, error } =
        await supabaseClient.auth.signUp({
            email: email,
            password: password
        });

    if (error) {

        message.className = "error";

        message.innerText =
            error.message;

        return;
    }

    if (data.user && !data.session) {

        message.className = "success";

        message.innerText =
            "✅ Account created! Check your email to confirm your account, then log in.";

        return;
    }

    message.innerText =
        "✅ Account created successfully.";

    showApp(data.user);
}


// ==========================================
// LOGIN
// ==========================================

async function login() {

    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;

    const message =
        document.getElementById("authMessage");

    if (!email || !password) {

        message.className = "error";

        message.innerText =
            "Please enter your email and password.";

        return;
    }

    message.className = "success";

    message.innerText =
        "Logging in...";

    const { data, error } =
        await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

    if (error) {

        message.className = "error";

        message.innerText =
            error.message;

        return;
    }

    showApp(data.user);
}


// ==========================================
// LOGOUT
// ==========================================

async function logout() {

    await supabaseClient.auth.signOut();

    document.getElementById("appScreen")
        .classList.add("hidden");

    document.getElementById("authScreen")
        .classList.remove("hidden");

    showLogin();
}


// ==========================================
// SHOW APP
// ==========================================

async function showApp(user) {

    if (!user) return;

    document.getElementById("authScreen")
        .classList.add("hidden");

    document.getElementById("appScreen")
        .classList.remove("hidden");

    document.getElementById("userEmail")
        .innerText = user.email;

    await updateRemaining(user.id);
}


// ==========================================
// CHECK LOGIN ON PAGE LOAD
// ==========================================

async function checkUser() {

    const {
        data: { user }
    } = await supabaseClient.auth.getUser();

    if (user) {

        showApp(user);

    } else {

        document.getElementById("authScreen")
            .classList.remove("hidden");

        document.getElementById("appScreen")
            .classList.add("hidden");
    }
}


// ==========================================
// DAILY GENERATION COUNT
// ==========================================

async function updateRemaining(userId) {

    const today = new Date();

    const start =
        new Date(
            today.getFullYear(),
            today.getMonth(),
            today.getDate()
        ).toISOString();

    const { count, error } =
        await supabaseClient
            .from("generation_requests")
            .select("*", {
                count: "exact",
                head: true
            })
            .eq("user_id", userId)
            .gte("created_at", start);

    if (error) {

        console.error(
            "Unable to update generation counter:",
            error
        );

        return;
    }

    const used = count || 0;

    const remaining =
        Math.max(0, 3 - used);

    document.getElementById("remaining")
        .innerText = remaining;
}


// ==========================================
// GENERATE POST
// ==========================================

async function generate() {

    const topic =
        document.getElementById("topic")
            .value.trim();

    const output =
        document.getElementById("output");

    const button =
        document.getElementById("generateButton");

    if (!topic) {

        output.className = "error";

        output.innerText =
            "Please enter a topic first.";

        return;
    }

    const {
        data: { user }
    } = await supabaseClient.auth.getUser();

    if (!user) {

        output.className = "error";

        output.innerText =
            "Please log in first.";

        return;
    }
    
// CHECK DAILY FREE GENERATION LIMIT
const today = new Date();

const start =
    new Date(
        today.getFullYear(),
        today.getMonth(),
        today.getDate()
    ).toISOString();

const { count, error: countError } =
    await supabaseClient
        .from("generation_history")
        .select("*", {
            count: "exact",
            head: true
        })
        .eq("user_id", user.id)
        .gte("created_at", start);

if (countError) {

    console.error(countError);

    output.className = "error";

    output.innerText =
        "Unable to check your daily generation limit. Please try again.";

    return;
}

const usedToday = count || 0;

if (usedToday >= 3) {

    output.className = "error";

    output.innerText =
        "🚫 You have used all 3 free generations for today. Please come back tomorrow.";

    document.getElementById("remaining")
        .innerText = "0";

    return;
    }

    


    output.className = "success";

    output.innerText =
        "Generating your post...";

    button.disabled = true;

    button.innerText =
        "Generating...";


    try {

        const {
            data: { session }
        } = await supabaseClient.auth.getSession();

        if (!session) {

            throw new Error(
                "Your login session has expired. Please log in again."
            );
        }


        const res = await fetch("/generate", {

            method: "POST",

            headers: {
                "Content-Type": "application/json",

                "Authorization":
                    "Bearer " + session.access_token
            },

            body: JSON.stringify({
                topic: topic
            })

        });


        const data = await res.json();


        if (!res.ok) {

            throw new Error(
                data.error ||
                "The server could not generate your post."
            );
        }


        if (!data.content) {

            throw new Error(
                "The AI returned no content. Please try again."
            );
        }


        output.className = "success";

        output.innerText =
            data.content;


        if (typeof data.remaining !== "undefined") {

            document.getElementById("remaining")
                .innerText = data.remaining;
        }


        await updateRemaining(user.id);


        document.getElementById("topic")
            .value = "";


    } catch (error) {

        console.error(error);

        output.className = "error";

        output.innerText =
            "❌ Error: " + error.message;

    } finally {

        button.disabled = false;

        button.innerText =
            "Generate Another Post";
    }
}


// ==========================================
// START APPLICATION
// ==========================================

checkUser();

</script>

</body>
        </html>
